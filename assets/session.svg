<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="A late night terminal log for Saudx0, next to a plain list of what he can do">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="0.55" stop-color="#0F141B"/>
      <stop offset="1" stop-color="#141B24"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.16" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#5B9DFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#5B9DFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#5B9DFF" stop-opacity="0"/>
    </radialGradient>

    <style>
      .sans { font-family: 'Inter', 'SF Pro Text', -apple-system, 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; }

      .line { animation: print 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .l1 { animation-delay: 0.30s; }
      .l2 { animation-delay: 0.48s; }
      .l3 { animation-delay: 0.64s; }
      .l4 { animation-delay: 0.80s; }
      .l5 { animation-delay: 1.08s; }
      .l6 { animation-delay: 1.24s; }
      .l7 { animation-delay: 1.40s; }
      .l8 { animation-delay: 1.70s; }
      .l9 { animation-delay: 1.86s; }
      @keyframes print {
        from { opacity: 0; transform: translateY(4px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .row { animation: print 0.7s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .r1 { animation-delay: 0.75s; }
      .r2 { animation-delay: 0.95s; }
      .r3 { animation-delay: 1.15s; }
      .r4 { animation-delay: 1.35s; }

      .caret { animation: breathe 1.9s ease-in-out 2.1s infinite both; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.12; }
      }

      .fade { animation: fade 0.9s ease-out 2.2s both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .line, .row, .caret, .fade { animation: none; }
        .caret { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#panel)"/>
  <rect width="1200" height="600" fill="url(#lamp)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#E6EDF3" stroke-opacity="0.07"/>

  <text class="sans" x="60" y="66" font-size="17" font-weight="600" letter-spacing="7.5" fill="#E6EDF3">SAUDX0</text>
  <text class="mono" x="60" y="88" font-size="10.5" letter-spacing="2.2" fill="#68788A">cs student · riyadh</text>
  <text class="mono" x="1140" y="66" text-anchor="end" font-size="10.5" letter-spacing="2.2" fill="#68788A">he / him</text>
  <text class="mono" x="1140" y="88" text-anchor="end" font-size="10.5" letter-spacing="2.2" fill="#68788A">utc+3</text>
  <line x1="60" y1="110" x2="1140" y2="110" stroke="#E6EDF3" stroke-opacity="0.08"/>

  <line x1="496" y1="140" x2="496" y2="470" stroke="#E6EDF3" stroke-opacity="0.08"/>

  <text class="mono" x="60" y="140" font-size="10" letter-spacing="2.6" fill="#68788A">a normal night</text>

  <g class="line l1">
    <text class="mono" x="60" y="176" font-size="13" fill="#5B9DFF">$</text>
    <text class="mono" x="78" y="176" font-size="13" fill="#B9C6D3">./lab --status</text>
  </g>
  <g class="line l2">
    <text class="mono" x="78" y="204" font-size="13" fill="#8798A8">vm-01</text>
    <text class="mono" x="170" y="204" font-size="13" fill="#E6EDF3">up</text>
  </g>
  <g class="line l3">
    <text class="mono" x="78" y="232" font-size="13" fill="#8798A8">vm-02</text>
    <text class="mono" x="170" y="232" font-size="13" fill="#E6EDF3">broken</text>
    <text class="mono" x="242" y="232" font-size="13" fill="#4C5A69">(again)</text>
  </g>
  <g class="line l4">
    <text class="mono" x="78" y="260" font-size="13" fill="#8798A8">vm-03</text>
    <text class="mono" x="170" y="260" font-size="13" fill="#E6EDF3">"temporary"</text>
  </g>

  <g class="line l5">
    <text class="mono" x="60" y="304" font-size="13" fill="#5B9DFF">$</text>
    <text class="mono" x="78" y="304" font-size="13" fill="#B9C6D3">cat notes/todo</text>
  </g>
  <g class="line l6">
    <text class="mono" x="78" y="332" font-size="13" fill="#8798A8">harden the baseline</text>
  </g>
  <g class="line l7">
    <text class="mono" x="78" y="360" font-size="13" fill="#8798A8">read the docs first</text>
  </g>

  <g class="line l8">
    <text class="mono" x="60" y="404" font-size="13" fill="#5B9DFF">$</text>
    <text class="mono" x="78" y="404" font-size="13" fill="#B9C6D3">echo $rank</text>
  </g>
  <g class="line l9">
    <text class="mono" x="78" y="432" font-size="13" fill="#E6EDF3">grand champ 2</text>
    <text class="mono" x="212" y="432" font-size="13" fill="#4C5A69">rocket league</text>
    <rect class="caret" x="316" y="420" width="7" height="14" rx="1" fill="#5B9DFF"/>
  </g>

  <text class="mono" x="528" y="140" font-size="10" letter-spacing="2.6" fill="#68788A">things i can do</text>

  <text class="mono" x="528" y="176" font-size="10" letter-spacing="2.6" fill="#5C6B7A">what</text>
  <text class="mono" x="1140" y="176" text-anchor="end" font-size="10" letter-spacing="2.6" fill="#5C6B7A">since</text>
  <line x1="528" y1="190" x2="1140" y2="190" stroke="#E6EDF3" stroke-opacity="0.08"/>

  <g class="row r1">
    <text class="mono" x="528" y="236" font-size="15" fill="#E6EDF3">linux</text>
    <text class="mono" x="1140" y="236" text-anchor="end" font-size="13" fill="#68788A">2021</text>
  </g>
  <g class="row r2">
    <text class="mono" x="528" y="280" font-size="15" fill="#E6EDF3">python</text>
    <text class="mono" x="1140" y="280" text-anchor="end" font-size="13" fill="#68788A">2022</text>
  </g>
  <g class="row r3">
    <text class="mono" x="528" y="324" font-size="15" fill="#E6EDF3">breaking my own lab</text>
    <text class="mono" x="1140" y="324" text-anchor="end" font-size="13" fill="#68788A">2023</text>
  </g>
  <g class="row r4">
    <text class="mono" x="528" y="368" font-size="15" fill="#E6EDF3">putting it back together</text>
    <text class="mono" x="1140" y="368" text-anchor="end" font-size="13" fill="#68788A">2024</text>
  </g>

  <g class="fade">
    <line x1="60" y1="506" x2="1140" y2="506" stroke="#E6EDF3" stroke-opacity="0.08"/>
    <text class="mono" x="60" y="540" font-size="10.5" letter-spacing="1.6" fill="#4C5A69">3 vms up · 1 broken · 0 regrets</text>
    <text class="mono" x="1140" y="540" text-anchor="end" font-size="10.5" letter-spacing="1.6" fill="#4C5A69">open to collaborating</text>
  </g>
</svg>
