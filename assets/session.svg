<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Build console: an environment build plan on the left, a capability table on the right">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="0.55" stop-color="#0F141B"/>
      <stop offset="1" stop-color="#141B24"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.16" cy="0.02" r="0.85">
      <stop offset="0" stop-color="#5B9DFF" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#5B9DFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#5B9DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B9DFF" stop-opacity="0.16"/>
      <stop offset="0.7" stop-color="#5B9DFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#5B9DFF" stop-opacity="0"/>
    </linearGradient>

    <style>
      .sans { font-family: 'Inter', 'SF Pro Text', -apple-system, 'Segoe UI', system-ui, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; }

      .spine { stroke-dasharray: 236; stroke-dashoffset: 236; animation: draw 1.1s cubic-bezier(0.33, 0.9, 0.3, 1) 0.35s forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }

      .node { animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .n1 { animation-delay: 0.75s; }
      .n2 { animation-delay: 1.05s; }
      .n3 { animation-delay: 1.35s; }
      .n4 { animation-delay: 1.65s; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      .row { animation: rise 0.85s cubic-bezier(0.22, 1, 0.36, 1) both; }
      .r1 { animation-delay: 1.9s; }
      .r2 { animation-delay: 2.12s; }
      .r3 { animation-delay: 2.34s; }
      .r4 { animation-delay: 2.56s; }

      .mark { animation: step 9s cubic-bezier(0.45, 0, 0.55, 1) 3.4s infinite; }
      @keyframes step {
        0%,   16%  { transform: translateY(0);      opacity: 0.85; }
        25%,  41%  { transform: translateY(44px);   opacity: 1; }
        50%,  66%  { transform: translateY(88px);   opacity: 1; }
        75%,  91%  { transform: translateY(132px);  opacity: 1; }
        100%       { transform: translateY(132px);  opacity: 0; }
      }

      .fade { animation: fade 1s ease-out 2.9s both; }
      @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .spine, .node, .row, .mark, .fade { animation: none; }
        .spine { stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="600" fill="url(#panel)"/>
  <rect width="1200" height="600" fill="url(#lamp)"/>
  <rect x="0.5" y="0.5" width="1199" height="599" fill="none" stroke="#E6EDF3" stroke-opacity="0.08"/>

  <text class="sans" x="60" y="66" font-size="17" font-weight="600" letter-spacing="7.5" fill="#E6EDF3">SAUDX0</text>
  <text class="mono" x="60" y="88" font-size="10.5" letter-spacing="2.4" fill="#68788A">security environment development</text>
  <text class="mono" x="1140" y="66" text-anchor="end" font-size="10.5" letter-spacing="2.2" fill="#68788A">riyadh / utc+3</text>
  <text class="mono" x="1140" y="88" text-anchor="end" font-size="10.5" letter-spacing="2.2" fill="#68788A">he / him</text>
  <line x1="60" y1="110" x2="1140" y2="110" stroke="#E6EDF3" stroke-opacity="0.09"/>

  <line x1="496" y1="140" x2="496" y2="520" stroke="#E6EDF3" stroke-opacity="0.09"/>

  <text class="mono" x="60" y="140" font-size="10" letter-spacing="2.8" fill="#68788A">BUILD PLAN</text>

  <line class="spine" x1="63" y1="158" x2="63" y2="394" stroke="#5B9DFF" stroke-opacity="0.30" stroke-width="1"/>

  <g class="node n1">
    <rect x="60" y="170" width="6" height="6" fill="#5B9DFF"/>
    <text class="mono" x="84" y="178" font-size="14" fill="#E6EDF3">Environment Design</text>
    <text class="mono" x="456" y="178" text-anchor="end" font-size="12" fill="#68788A">segments</text>
  </g>
  <g class="node n2">
    <rect x="60" y="224" width="6" height="6" fill="#5B9DFF" fill-opacity="0.55"/>
    <text class="mono" x="84" y="232" font-size="14" fill="#B9C6D3">Control Baseline</text>
    <text class="mono" x="456" y="232" text-anchor="end" font-size="12" fill="#68788A">identity</text>
  </g>
  <g class="node n3">
    <rect x="60" y="278" width="6" height="6" fill="#5B9DFF" fill-opacity="0.55"/>
    <text class="mono" x="84" y="286" font-size="14" fill="#B9C6D3">Hardening Pass</text>
    <text class="mono" x="456" y="286" text-anchor="end" font-size="12" fill="#68788A">endpoint</text>
  </g>
  <g class="node n4">
    <rect x="60" y="332" width="6" height="6" fill="#5B9DFF" fill-opacity="0.55"/>
    <text class="mono" x="84" y="340" font-size="14" fill="#B9C6D3">Verification</text>
    <text class="mono" x="456" y="340" text-anchor="end" font-size="12" fill="#68788A">data</text>
  </g>

  <text class="mono" x="60" y="392" font-size="11" letter-spacing="0.6" fill="#4C5A69">planning 0.014 ms · execution 0.31 ms</text>

  <text class="mono" x="528" y="140" font-size="10" letter-spacing="2.8" fill="#68788A">CAPABILITIES · 4</text>

  <text class="mono" x="528" y="176" font-size="10" letter-spacing="2.8" fill="#68788A">AREA</text>
  <text class="mono" x="1140" y="176" text-anchor="end" font-size="10" letter-spacing="2.8" fill="#68788A">SINCE</text>
  <line x1="528" y1="190" x2="1140" y2="190" stroke="#E6EDF3" stroke-opacity="0.09"/>

  <g class="mark">
    <rect x="516" y="210" width="636" height="40" rx="4" fill="url(#hl)"/>
    <rect x="516" y="210" width="2" height="40" fill="#5B9DFF"/>
  </g>

  <g class="row r1">
    <text class="mono" x="528" y="236" font-size="15" fill="#E6EDF3">environment_security</text>
    <text class="mono" x="1140" y="236" text-anchor="end" font-size="14" fill="#68788A">2022</text>
  </g>
  <g class="row r2">
    <text class="mono" x="528" y="280" font-size="15" fill="#E6EDF3">network_defense</text>
    <text class="mono" x="1140" y="280" text-anchor="end" font-size="14" fill="#68788A">2023</text>
  </g>
  <g class="row r3">
    <text class="mono" x="528" y="324" font-size="15" fill="#E6EDF3">offensive_labs</text>
    <text class="mono" x="1140" y="324" text-anchor="end" font-size="14" fill="#68788A">2024</text>
  </g>
  <g class="row r4">
    <text class="mono" x="528" y="368" font-size="15" fill="#E6EDF3">ai_security</text>
    <text class="mono" x="1140" y="368" text-anchor="end" font-size="14" fill="#68788A">2025</text>
  </g>

  <line x1="528" y1="404" x2="1140" y2="404" stroke="#E6EDF3" stroke-opacity="0.09"/>

  <g class="fade">
    <text class="mono" x="60" y="540" font-size="10.5" letter-spacing="1.8" fill="#4C5A69">log: design · baseline · harden · verify</text>
    <text class="mono" x="1140" y="540" text-anchor="end" font-size="10.5" letter-spacing="1.8" fill="#4C5A69">SCOPE · INDIVIDUAL / PLACE</text>
  </g>
</svg>
