<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="210" viewBox="0 0 1200 210" role="img" aria-label="still querying">
  <defs>
    <radialGradient id="paper2" cx="0.5" cy="0.4" r="0.95">
      <stop offset="0" stop-color="#FBF9F3"/>
      <stop offset="0.65" stop-color="#F6F2E9"/>
      <stop offset="1" stop-color="#EFE9DD"/>
    </radialGradient>

    <pattern id="grain2" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="0.65" fill="#1F1B18" fill-opacity="0.055"/>
      <circle cx="12.5" cy="14.5" r="0.45" fill="#1F1B18" fill-opacity="0.04"/>
    </pattern>

    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A9512C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#A9512C" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A9512C" stop-opacity="0"/>
    </linearGradient>

    <style>
      .mono  { font-family: 'JetBrains Mono', 'SF Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace; }
      .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif; }

      .dot { animation: travel 9s cubic-bezier(0.45, 0, 0.55, 1) infinite; }
      @keyframes travel {
        0%   { transform: translateX(0);       opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { transform: translateX(1064px);  opacity: 0; }
      }

      .caret { animation: caret 1.5s ease-in-out infinite; }
      @keyframes caret {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0.05; }
      }

      @media (prefers-reduced-motion: reduce) {
        .dot, .caret { animation: none; }
      }
    </style>
  </defs>

  <rect width="1200" height="210" fill="url(#paper2)"/>
  <rect width="1200" height="210" fill="url(#grain2)"/>

  <text class="serif" x="60" y="100" font-size="42" font-style="italic" fill="#1F1B18">still querying.</text>
  <text class="mono" x="60" y="130" font-size="11.5" letter-spacing="2" fill="#8B8279">riyadh · utc+3 · open to collaboration · no rows withheld</text>

  <rect class="caret" x="336" y="72" width="9" height="30" rx="1" fill="#A9512C"/>

  <line x1="60" y1="166" x2="1140" y2="166" stroke="#1F1B18" stroke-opacity="0.11"/>
  <rect x="0" y="164" width="120" height="4" fill="url(#trail)">
    <animate attributeName="x" values="-120;1200" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines="0.45 0 0.55 1" keyTimes="0;1"/>
  </rect>
  <circle class="dot" cx="60" cy="166" r="2.6" fill="#A9512C"/>

  <text class="mono" x="1140" y="196" text-anchor="end" font-size="10.5" letter-spacing="1.8" fill="#8B8279">end of result set</text>
</svg>
