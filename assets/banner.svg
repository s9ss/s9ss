<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Synax banner: a brush wordmark on the left, a hand drawn ink portrait on the right.">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E13"/>
      <stop offset="1" stop-color="#141B24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.79" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#1B2431"/>
      <stop offset="1" stop-color="#0B0E13" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc">
      <circle cx="840" cy="148" r="98"/>
    </clipPath>
  </defs>

  <rect width="1000" height="280" fill="url(#panel)"/>
  <rect width="1000" height="280" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" fill="none" stroke="#1C2430"/>

  <!-- wordmark -->
  <g transform="rotate(-3 300 150)">
    <text x="72" y="176" font-family="Georgia, 'Times New Roman', serif" font-size="104" font-style="italic" font-weight="700" fill="#E6EDF3" letter-spacing="-3">Synax!</text>
    <path d="M 74 198 C 160 208, 250 202, 358 192" fill="none" stroke="#E6EDF3" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- ink flecks around the wordmark -->
  <g fill="#E6EDF3">
    <circle cx="392" cy="96" r="3" opacity="0.7"/>
    <circle cx="418" cy="118" r="1.6" opacity="0.45"/>
    <circle cx="60" cy="112" r="2" opacity="0.4"/>
    <circle cx="352" cy="224" r="2.4" opacity="0.35"/>
    <path d="M 404 210 q 5 -9 10 -1 q -4 7 -10 1 z" opacity="0.3"/>
  </g>

  <!-- ink portrait: black ink on a white disc -->
  <circle cx="840" cy="148" r="98" fill="#F2F5F9"/>

  <g clip-path="url(#disc)">
    <path d="M 744 268 C 754 230, 792 212, 840 212 C 888 212, 926 230, 936 268 Z" fill="#0B0E13"/>
    <path d="M 776 262 C 770 178, 792 90, 840 90 C 888 90, 910 178, 904 262 Z" fill="#0B0E13"/>

    <ellipse cx="840" cy="152" rx="50" ry="60" fill="#F2F5F9"/>
    <path d="M 790 150 C 796 106, 884 106, 890 150 C 878 130, 868 126, 858 136 C 850 144, 844 126, 838 120 C 830 130, 820 138, 812 132 C 802 126, 796 136, 790 150 Z" fill="#0B0E13"/>

    <!-- eyes and brows -->
    <g fill="#0B0E13">
      <ellipse cx="818" cy="167" rx="7" ry="2.6"/>
      <ellipse cx="862" cy="167" rx="7" ry="2.6"/>
    </g>
    <g fill="none" stroke="#0B0E13" stroke-width="3" stroke-linecap="round">
      <path d="M 806 152 C 814 146, 826 146, 832 151"/>
      <path d="M 848 151 C 854 146, 866 146, 874 152"/>
      <path d="M 830 197 C 836 199, 844 199, 850 197"/>
    </g>

    <g fill="none" stroke="#F2F5F9" stroke-width="2" opacity="0.45" stroke-linecap="round">
      <path d="M 786 126 C 776 170, 774 216, 776 258"/>
      <path d="M 894 126 C 904 170, 906 216, 904 258"/>
      <path d="M 800 108 C 792 150, 790 200, 792 250"/>
    </g>
  </g>

  <!-- flecks breaking the disc edge -->
  <g fill="#F2F5F9">
    <circle cx="742" cy="96" r="3.2"/>
    <circle cx="930" cy="212" r="2.4"/>
    <circle cx="936" cy="96" r="2"/>
    <circle cx="744" cy="216" r="1.8"/>
  </g>

  <!-- ink droplets on the panel -->
  <g fill="#E6EDF3">
    <circle cx="958" cy="176" r="1.5" opacity="0.35"/>
    <circle cx="722" cy="200" r="2" opacity="0.3"/>
    <circle cx="936" cy="232" r="1.8" opacity="0.3"/>
    <path d="M 932 108 q 4 -10 9 -2 q -3 8 -9 2 z" opacity="0.28"/>
  </g>
</svg>

