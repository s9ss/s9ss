<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Saud AL-Mutairi - SQL AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#010409"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D353"/>
      <stop offset="0.5" stop-color="#7EE787"/>
      <stop offset="1" stop-color="#39D353"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39D353" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#39D353"/>
      <stop offset="1" stop-color="#39D353" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#39D353" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39D353" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#39D353" fill-opacity="0.10"/>
    </pattern>
    <style>
      .blob-a { animation: drift-a 14s ease-in-out infinite; transform-origin: center; }
      .blob-b { animation: drift-b 18s ease-in-out infinite; transform-origin: center; }
      .blob-c { animation: drift-c 22s ease-in-out infinite; transform-origin: center; }
      .fade-in { animation: fade 1.4s ease-out both; }
      .fade-in-2 { animation: fade 1.4s ease-out 0.35s both; }
      .fade-in-3 { animation: fade 1.4s ease-out 0.7s both; }
      .caret { animation: blink 1s steps(1) infinite; }
      .bob { animation: bob 6s ease-in-out infinite; transform-origin: center; }
      @keyframes drift-a { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(70px,-40px) scale(1.15); } }
      @keyframes drift-b { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(-90px,50px) scale(0.9); } }
      @keyframes drift-c { 0%,100% { transform: translate(0,0) scale(0.95); } 50% { transform: translate(40px,60px) scale(1.2); } }
      @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <g filter="url(#soften)">
    <circle class="blob-a" cx="180" cy="90" r="170" fill="url(#glowA)"/>
    <circle class="blob-b" cx="1020" cy="230" r="200" fill="url(#glowB)"/>
    <circle class="blob-c" cx="640" cy="330" r="150" fill="url(#glowA)" opacity="0.5"/>
  </g>

  <g class="fade-in">
    <text x="600" y="72" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="14" letter-spacing="6" fill="#39D353" fill-opacity="0.75">// HELLO_WORLD</text>
  </g>

  <g class="bob">
    <text class="fade-in" x="600" y="160" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="62" font-weight="700" letter-spacing="3" fill="url(#nameGrad)">Saud AL-Mutairi</text>
  </g>

  <g class="fade-in-2">
    <text x="600" y="206" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="19" letter-spacing="2" fill="#8B949E">CS Student  ·  SQL AI Engineer  ·  Riyadh</text>
  </g>

  <g class="fade-in-3">
    <rect x="420" y="232" width="360" height="2" rx="1" fill="url(#rule)">
      <animate attributeName="width" values="0;360;360" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="x" values="600;420;420" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="268" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace" font-size="15" fill="#39D353" fill-opacity="0.85">SELECT * FROM curiosity WHERE shipped = true;<tspan class="caret" fill="#7EE787">_</tspan></text>
  </g>
</svg>
